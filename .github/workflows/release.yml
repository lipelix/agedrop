name: Release

# Publishes agedrop to npm with provenance when a signed tag v<version> is pushed (see CONTRIBUTING.md § Releases).
# npm provenance needs a GitHub-hosted runner, so this job does not use RUNNER_LABELS. Hosted runners are free for
# public repositories.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/agedrop
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance (Sigstore) and trusted publishing
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then echo "Tag $TAG does not match package.json version $version"; exit 1; fi
          grep -q "^## \[$version\] - " CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
          if [ "$(jq -r .object.type <<<"$ref")" != tag ]; then echo "$TAG is a lightweight tag; push a signed one (git tag -s)"; exit 1; fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)"
          if [ "$verified" != true ]; then echo "GitHub does not verify the signature of $TAG"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: ./.github/actions/install-age

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer.
      - run: npm install -g npm@11

      - name: Publish to npm
        env:
          # A granular npm token with publish rights to agedrop, needed until trusted publishing is set up on
          # npmjs.com (package settings → Trusted publisher → this workflow). With trusted publishing, delete it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Check the published package
        run: |
          version="$(node -p 'require("./package.json").version')"
          dir="$(mktemp -d)"
          cd "$dir"
          for attempt in 1 2 3 4 5 6; do
            if npx --yes "agedrop@$version" init --owner release-check; then break; fi
            if [ "$attempt" = 6 ]; then echo "npx agedrop@$version init failed"; exit 1; fi
            sleep 20
          done
          test -f agedrop.toml && test -f agedrop.lock

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "agedrop $version" --notes-file "$RUNNER_TEMP/notes.md"

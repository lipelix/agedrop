name: Deploy web UI

# Builds web/ and uploads it to the Cloudflare Pages project behind app.agedrop.dev
# (infra/ creates the project, the domain and the two settings below).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment:
      name: app
      url: https://app.agedrop.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:web

      - name: Deploy to Cloudflare Pages
        env:
          # A token from the personal Cloudflare account with Account · Cloudflare Pages · Edit only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Missing required secret: CLOUDFLARE_API_TOKEN (see infra/)"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID (see infra/)"; exit 1; fi
          npx --yes wrangler@4.162.0 pages deploy dist-web \
            --project-name agedrop-app \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
          echo "Deployed ${GITHUB_SHA} to https://app.agedrop.dev" >> "$GITHUB_STEP_SUMMARY"

name: Deploy landing page

# Uploads site/ (without the design notes in site/.hallmark/) to the Cloudflare Pages project behind
# agedrop.dev. infra/ creates the project, the domain and the two settings below.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LABELS && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: site
      url: https://agedrop.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage site/
        run: |
          rm -rf dist-site
          cp -R site dist-site
          rm -rf dist-site/.hallmark
          find dist-site -type f | sort

      - name: Deploy to Cloudflare Pages
        env:
          # A token from the personal Cloudflare account with Account · Cloudflare Pages · Edit only.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Missing required secret: CLOUDFLARE_API_TOKEN (see infra/)"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID (see infra/)"; exit 1; fi
          npx --yes wrangler@4.162.0 pages deploy dist-site \
            --project-name agedrop-site \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false
          echo "Deployed ${GITHUB_SHA} to https://agedrop.dev" >> "$GITHUB_STEP_SUMMARY"
